name: Release

on:
  workflow_dispatch:
    inputs:
      major:
        description: 'Major Version'
        required: true
        type: number
      minor:
        description: 'Minor Version'
        required: true
        type: number
      patch:
        description: 'Patch Version'
        required: true
        type: number
      pre_release_id:
        description: 'Prerelease identifier (e.g. rc.1, beta.2)'
        required: false
        type: string
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}
      source: ${{ steps.resolve.outputs.source }}
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve version and source
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Triggered by tag push — use the tag as-is
            TAG="${GITHUB_REF##*/}"
            VERSION="${TAG#v}"
            echo "source=tag" >> "$GITHUB_OUTPUT"
            echo "commit_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            # Triggered by workflow_dispatch — compose from inputs
            MAJOR=${{ github.event.inputs.major }}
            MINOR=${{ github.event.inputs.minor }}
            PATCH=${{ github.event.inputs.patch }}
            PRERELEASE="${{ github.event.inputs.pre_release_id }}"

            if [[ ! "$MAJOR" =~ ^[0-9]+$ ]] || [[ ! "$MINOR" =~ ^[0-9]+$ ]] || [[ ! "$PATCH" =~ ^[0-9]+$ ]]; then
              echo "ERROR: major, minor, patch must be numbers"
              exit 1
            fi

            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            if [ -n "$PRERELEASE" ]; then
              if [[ ! "$PRERELEASE" =~ ^[a-zA-Z0-9.-]+$ ]]; then
                echo "ERROR: Invalid prerelease identifier: ${PRERELEASE}"
                exit 1
              fi
              VERSION="${VERSION}-${PRERELEASE}"
            fi

            TAG="v${VERSION}"
            echo "source=dispatch" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [[ "${TAG}" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if tag already exists
        if: steps.resolve.outputs.source == 'dispatch'
        run: |
          if git rev-parse "refs/tags/${{ steps.resolve.outputs.tag }}" >/dev/null 2>&1; then
            echo "ERROR: Tag ${{ steps.resolve.outputs.tag }} already exists!"
            exit 1
          fi

  # ----------------------------------------------------------------
  # Branch: create release-vX.Y branch for stable releases
  # ----------------------------------------------------------------
  branch:
    name: Create Release Branch
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [validate]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ env.GH_TOKEN }}
          fetch-depth: 0

      - name: Set git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release branch (stable releases only)
        if: ${{ github.event.inputs.pre_release_id == '' }}
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION#*.}"; MINOR="${MINOR%%.*}"
          BRANCH="release-v${MAJOR}.${MINOR}"

          if git ls-remote origin "refs/heads/${BRANCH}" | head -1 | grep -q .; then
            echo "Branch ${BRANCH} already exists, skipping creation."
          else
            git branch "${BRANCH}"
            git push origin "${BRANCH}"
            echo "Created branch: ${BRANCH}"
          fi

  # ----------------------------------------------------------------
  # Publish: bump versions, commit, tag, publish, create release
  # ----------------------------------------------------------------
  publish:
    name: Publish
    if: ${{ always() && needs.validate.result == 'success' && needs.branch.result != 'failure' && !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [validate, branch]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ env.GH_TOKEN }}

      - name: Set release info and target branch
        run: |
          echo "RELEASE_TAG=${{ needs.validate.outputs.tag }}" >> $GITHUB_ENV
          echo "IS_PRERELEASE=${{ needs.validate.outputs.is_prerelease }}" >> $GITHUB_ENV
          echo "VERSION=${{ needs.validate.outputs.version }}" >> $GITHUB_ENV

          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "TARGET_BRANCH=" >> $GITHUB_ENV
          else
            VERSION="${{ needs.validate.outputs.version }}"
            MAJOR="${VERSION%%.*}"
            MINOR="${VERSION#*.}"; MINOR="${MINOR%%.*}"
            BRANCH="release-v${MAJOR}.${MINOR}"
            echo "TARGET_BRANCH=${BRANCH}" >> $GITHUB_ENV
            git fetch origin "${BRANCH}" 2>/dev/null || true
            if git branch -r | grep -q "origin/${BRANCH}"; then
              git checkout "${BRANCH}"
            fi
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'yarn'
          registry-url: 'https://npm.pkg.github.com'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Configure Yarn npm auth for GitHub Packages
        run: |
          yarn config set npmScopes.rithakith.npmRegistryServer "https://npm.pkg.github.com"
          yarn config set npmScopes.rithakith.npmAuthToken "${GH_TOKEN}"

      - name: Type check (generate type declarations)
        run: yarn tsc

      - name: Build all workspaces
        run: yarn build:all

      - name: Bump versions with changesets
        run: |
          yarn release:version

      - name: Override versions to exact release version
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          node scripts/set-version.js "${{ needs.validate.outputs.version }}"
          yarn prettier --write '{packages,plugins}/*/{package.json,CHANGELOG.md}' 'package.json' || true
          yarn install --mode=update-lockfile

      - name: Commit version bump
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git reset .yarnrc.yml || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: version bump to v${VERSION}"
            git push origin "HEAD:${TARGET_BRANCH}"
            echo "COMMIT_TO_TAG=$(git rev-parse HEAD)" >> $GITHUB_ENV
          else
            echo "COMMIT_TO_TAG=${GITHUB_SHA}" >> $GITHUB_ENV
          fi

      - name: Publish to GitHub Packages
        run: |
          TAG=latest
          if [ "${IS_PRERELEASE}" = "true" ]; then
            TAG=next
          fi
          yarn workspaces foreach --all --no-private --topological --verbose \
            npm publish --tolerate-republish --access public --tag "${TAG}"
        env:
          NODE_AUTH_TOKEN: ${{ env.GH_TOKEN }}

      - name: Create git tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Use the new commit if we bumped versions, else the original SHA
          TARGET_SHA="${COMMIT_TO_TAG:-$GITHUB_SHA}"
          git tag "${RELEASE_TAG}" "${TARGET_SHA}"
          git push origin "${RELEASE_TAG}"

      - name: Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --title "v${VERSION}" \
            --generate-notes \
            --prerelease="${IS_PRERELEASE}"
        env:
          GH_TOKEN: ${{ env.GH_TOKEN }}
