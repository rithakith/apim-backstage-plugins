name: Release

# This workflow only runs when a Changesets "Version PR" is merged to main.
#
# The full developer release flow:
#
#   1. Developer makes code changes in a feature branch.
#
#   2. Before opening the PR, the developer runs:
#        yarn changeset
#      This is an interactive prompt asking:
#        - Which packages changed? (select from list)
#        - Is it a patch / minor / major bump?
#        - Write a short description of the change.
#      A small markdown file is created in .changeset/ and committed with the PR.
#
#   3. The PR is reviewed and merged to main as normal (build-and-test.yml runs all checks).
#
#   4. The Changesets GitHub Action (below) automatically opens a "Version PR"
#      that bumps all affected package.json versions and updates CHANGELOGs.
#      Example: 0.0.1 -> 0.0.2 for a patch bump.
#
#   5. The team reviews the Version PR and merges it when ready to release.
#
#   6. ONLY at this point does this release.yml trigger — it builds the three
#      plugins and publishes them to npm.
#
# This means:
#   - Developers can merge many commits without triggering a publish.
#   - Publishing is always an intentional, reviewed action.
#   - The version is always bumped before publish (no duplicate version errors).
#
# TODO: Before this workflow can run you must:
#   1. Install Changesets:  yarn add -D @changesets/cli
#   2. Initialize:          yarn changeset init
#   3. Configure the npm registry (see options A/B/C below).
#   4. Add the NPM_TOKEN secret to your GitHub repository settings.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout (full history needed by Changesets) ────────────────────
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # ── 2. Setup Node ──────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'yarn'
          # TODO: Set this to your registry:
          # Option A — Public npm:      https://registry.npmjs.org
          # Option B — GitHub Packages: https://npm.pkg.github.com
          # Option C — Private registry: your internal URL
          registry-url: 'https://registry.npmjs.org'

      # ── 3. Enable Corepack (required for Yarn 4) ───────────────────────────
      - name: Enable Corepack
        run: corepack enable

      # ── 4. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: yarn install --immutable

      # ── 5. Create Version PR OR publish ───────────────────────────────────
      #    The Changesets action does two different things depending on state:
      #
      #    STATE A — There are unconsumed .changeset/*.md files on main:
      #      -> Opens (or updates) a "Version Packages PR" that bumps versions
      #         and updates CHANGELOG.md files. Nothing is published yet.
      #
      #    STATE B — A Version PR was just merged (changesets are consumed):
      #      -> Builds and publishes the packages to npm.
      #
      - name: Create Version PR or Publish
        uses: changesets/action@v1
        with:
          # The command Changesets runs to publish when versions are ready.
          publish: yarn changeset publish
          # Optional: commit message for the version bump PR.
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          # TODO: Add NPM_TOKEN as a secret in GitHub repository settings.
          # Option A (npm):             NODE_AUTH_TOKEN = NPM_TOKEN secret
          # Option B (GitHub Packages): NODE_AUTH_TOKEN = GITHUB_TOKEN (built-in)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── What yarn changeset publish does internally ────────────────────────
      #    It detects which packages had version bumps and for each one runs:
      #
      #    yarn workspace @wso2/backstage-plugin-wso2-api-platform build
      #    yarn workspace @wso2/backstage-plugin-wso2-api-platform npm publish
      #
      #    yarn workspace @wso2/backstage-plugin-wso2-api-platform-backend build
      #    yarn workspace @wso2/backstage-plugin-wso2-api-platform-backend npm publish
      #
      #    yarn workspace @wso2/backstage-plugin-catalog-backend-module-wso2-api-platform build
      #    yarn workspace @wso2/backstage-plugin-catalog-backend-module-wso2-api-platform npm publish
